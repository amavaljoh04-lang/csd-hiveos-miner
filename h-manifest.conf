################################################################################
# CSD Pool Miner v0.2.0-optimized - HiveOS Custom Miner Integration
# Compute Substrate (CSD) - SHA256d mining (CUDA / OpenCL / CPU)
# Optimized kernel: early-exit, optimized maj(), 12 auto-tune geometries
################################################################################

# Miner name (must match tar.gz directory name)
CUSTOM_NAME=csd-pool-miner

# Log path
CUSTOM_LOG_BASENAME=/var/log/miner/csd-pool-miner/csd-pool-miner
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/csd-pool-miner/config.toml

# Version - intentionally left empty to prevent HiveOS from trying to
# install non-existent apt packages (hive-miners-custom-VERSION)
MINER_VER=
MINER_LATEST_VER_URL=
